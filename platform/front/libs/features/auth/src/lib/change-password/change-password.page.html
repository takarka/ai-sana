<div class="app-change-password">
  <form class="app-change-password__card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="app-change-password__title">{{ 'auth.changePassword.title' | translate }}</h1>
    <p class="app-change-password__subtitle">{{ 'auth.changePassword.subtitle' | translate }}</p>

    <craft-input
      [label]="'auth.changePassword.currentLabel' | translate"
      type="password"
      formControlName="currentPassword"
      autocomplete="current-password"
    ></craft-input>

    <craft-input
      [label]="'auth.changePassword.newLabel' | translate"
      type="password"
      formControlName="newPassword"
      autocomplete="new-password"
    ></craft-input>

    @if (errorKey(); as key) {
      <p class="app-change-password__error" role="alert">{{ key | translate }}</p>
    }

    <craft-button type="submit" variant="primary" [fullWidth]="true" [disabled]="submitting()">
      {{ (submitting() ? 'auth.changePassword.submitting' : 'auth.changePassword.submit') | translate }}
    </craft-button>
  </form>
</div>
