<span class="craft-pagination__range">{{ rangeStart() }}–{{ rangeEnd() }} из {{ totalCount() }}</span>

<div class="craft-pagination__controls">
  <button
    type="button"
    class="craft-pagination__btn"
    [disabled]="page() <= 1"
    (click)="goTo(page() - 1)"
    aria-label="Предыдущая страница"
  >
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M15 6l-6 6 6 6" />
    </svg>
  </button>
  <span class="craft-pagination__page">{{ page() }} / {{ totalPages() }}</span>
  <button
    type="button"
    class="craft-pagination__btn"
    [disabled]="page() >= totalPages()"
    (click)="goTo(page() + 1)"
    aria-label="Следующая страница"
  >
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M9 6l6 6-6 6" />
    </svg>
  </button>
</div>
