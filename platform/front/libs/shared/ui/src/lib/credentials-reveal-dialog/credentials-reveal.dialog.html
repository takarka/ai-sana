<craft-modal
  [modalTitle]="'credentialsDialog.title' | translate"
  [description]="'credentialsDialog.description' | translate"
  (closed)="close()"
>
  <div class="app-credentials">
    <div class="app-credentials__row">
      <span class="app-credentials__label">{{ 'credentialsDialog.loginLabel' | translate }}</span>
      <div class="app-credentials__value-row">
        <code class="app-credentials__value">{{ data.login }}</code>
        <button type="button" class="app-credentials__copy" (click)="copy('login')">
          {{ (copiedField() === 'login' ? 'common.copied' : 'common.copy') | translate }}
        </button>
      </div>
    </div>

    <div class="app-credentials__row">
      <span class="app-credentials__label">{{ 'credentialsDialog.passwordLabel' | translate }}</span>
      <div class="app-credentials__value-row">
        <code class="app-credentials__value">{{ data.password }}</code>
        <button type="button" class="app-credentials__copy" (click)="copy('password')">
          {{ (copiedField() === 'password' ? 'common.copied' : 'common.copy') | translate }}
        </button>
      </div>
    </div>
  </div>

  <div craftModalFooter>
    <craft-button variant="primary" type="button" (click)="close()">{{ 'credentialsDialog.done' | translate }}</craft-button>
  </div>
</craft-modal>
