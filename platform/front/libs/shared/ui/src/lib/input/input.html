@if (label(); as labelText) {
  <label class="craft-input__label" [for]="id">{{ labelText }}</label>
}

<div class="craft-input__field" [class.craft-input__field--invalid]="error()">
  @if (iconPath(); as path) {
    <svg
      class="craft-input__icon"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path [attr.d]="path" />
    </svg>
  }

  <input
    [id]="id"
    class="craft-input__control"
    [class.craft-input__control--with-icon]="iconPath()"
    [type]="resolvedType"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [disabled]="disabled()"
    [value]="value()"
    [attr.aria-invalid]="error() ? 'true' : null"
    (input)="handleInput($any($event.target).value)"
    (blur)="handleBlur()"
  />

  @if (type() === 'password') {
    <button
      type="button"
      class="craft-input__reveal"
      [attr.aria-label]="revealPassword() ? 'Скрыть пароль' : 'Показать пароль'"
      (click)="toggleReveal()"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
        <circle cx="12" cy="12" r="2.6" />
      </svg>
    </button>
  }
</div>

@if (error(); as errorText) {
  <p class="craft-input__error">{{ errorText }}</p>
}
