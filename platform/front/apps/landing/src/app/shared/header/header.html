      <a routerLink="/pisa" routerLinkActive="is-active" (click)="closeNav()" i18n="@@nav.pisa">CRAFT PISA</a>

    </nav>

    <div class="head__side">
      <craft-button class="header-cta" variant="primary" (click)="openDemo()" i18n="@@nav.cta">Запросить демо</craft-button>
      <app-lang-switcher></app-lang-switcher>
      <button
        class="burger"
        (click)="toggleNav()"
        [attr.aria-expanded]="navOpen()"
        aria-label="Открыть меню"
        i18n-aria-label="@@nav.menu"
        aria-controls="app-nav"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M3 7h18M3 17h18" />
        </svg>
      </button>
    </div>
