<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Фолбэк на случай отказа JS/до гидратации — на каждом маршруте
         перезаписывается shared/seo.ts (setSeo()) в конструкторе
         соответствующей страницы, включая SSR-рендер (находка 05,
         docs/plan/04-landing-migration-audit.md). Canonical и hreflang туда
         же не кладём статикой: без маршрута их href был бы неверным для
         всех страниц, кроме главной. -->
    <title>CRAFT AI — ИИ-экосистема для школ Казахстана</title>
    <meta
      name="description"
      content="Единая образовательная операционная система для школ Казахстана: готовые уроки по ГОСО, практический курс ИИ и подготовка к PISA-2029."
    />
    <!-- OG/Twitter — статичный фолбэк на главную (как title/description выше),
         перезаписывается setSeo() с per-route значениями и абсолютным
         canonical-url. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CRAFT AI" />
    <meta
      property="og:title"
      content="CRAFT AI — ИИ-экосистема для школ Казахстана"
    />
    <meta
      property="og:description"
      content="Единая образовательная операционная система для школ Казахстана: готовые уроки по ГОСО, практический курс ИИ и подготовка к PISA-2029."
    />
    <meta property="og:image" content="https://craftai.kz/img/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://craftai.kz/img/og-cover.png" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- SVG-иконка идёт после .ico: браузеры, умеющие image/svg+xml,
         берут последнюю подходящую и получают векторный знак, старым
         (в т.ч. Safari) остаётся растровый фолбэк. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
