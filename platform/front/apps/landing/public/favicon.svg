<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CRAFT AI">
  <title>CRAFT AI</title>
  <!-- Знак собран из логотипа CRAFT AI (shared/header/header.html): взята
       первая литера «C» вордмарка как есть, без перерисовки — исходный
       контур в системе координат 456×77 масштабируется до 32×44 и
       центрируется в плитке 64×64. Цвета — токены brand (#0004eb) и
       on-signal (#eaf0ff) из libs/shared/ui-tokens/src/tokens/_color.scss,
       вписаны литералами: favicon грузится браузером отдельным файлом, и
       CSS-переменные приложения здесь недоступны. При смене токенов
       править вручную. Из этого же файла растеризован соседний
       favicon.ico (16/32/48) для браузеров без поддержки SVG-иконок —
       при правке знака пересобирать оба. -->
  <rect width="64" height="64" rx="14" fill="#0004eb" />
  <path
    transform="translate(16 10) scale(0.5714286)"
    d="M0.00,13.00A13.00,13.00 0 0 1 13.00,0.00L56.00,0.00L56.00,14.00L13.00,14.00L13.00,63.50L56.00,63.50L56.00,77.00L13.00,77.00A13.00,13.00 0 0 1 0.00,64.00Z"
    fill="#eaf0ff"
  />
</svg>
