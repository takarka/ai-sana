services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: craftai
      POSTGRES_PASSWORD: craftai
      POSTGRES_DB: craftai
    ports:
      - "5432:5432"
    volumes:
      - craftai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - craftai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  craftai-postgres-data:
  craftai-redis-data:
